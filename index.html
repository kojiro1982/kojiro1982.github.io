<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渡辺賢二のプロフィール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cobalt: #2438c9;
      --cobalt-deep: #1a2a9e;
      --paper: #f6f7f9;
      --ink: #1a1d24;
      --muted: #6b7280;
      --line: #dce1f7;
      --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cobalt: #3346d6;
        --cobalt-deep: #2536b8;
        --paper: #15171d;
        --ink: #eef0f4;
        --muted: #9aa1ad;
        --line: #2b3040;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.8;
      display: grid;
      grid-template-columns: minmax(280px, 42%) 1fr;
    }

    /* 左：縦書きの宣言文 */
    .statement {
      position: relative;
      background: var(--cobalt);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      overflow: hidden;
    }
    .statement::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }
    .statement p {
      margin: 0;
      writing-mode: vertical-rl;
      font-family: var(--serif);
      font-weight: 800;
      font-size: clamp(56px, 8.4vw, 116px);
      line-height: 1.25;
      letter-spacing: 0.08em;
      text-orientation: mixed;
    }
    .statement .latin {
      text-combine-upright: all;
    }
    .statement .line {
      display: block;
      animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both;
    }
    .statement .line + .line {
      animation-delay: .25s;
      margin-top: 1.4em;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(-0.6em); }
      to   { opacity: 1; transform: none; }
    }

    /* 右：プロフィール */
    .profile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px clamp(24px, 7vw, 112px);
      max-width: 720px;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(44px, 5.6vw, 72px);
      line-height: 1.15;
      letter-spacing: 0.06em;
    }
    .job {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .section {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .likes {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 40px;
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(26px, 2.8vw, 34px);
      line-height: 1.4;
    }
    .likes li { position: relative; }
    .likes li::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 1.2em;
      height: 3px;
      background: var(--cobalt);
    }

    .sns {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 2px solid var(--ink);
      transition: color .2s, border-color .2s;
    }
    .sns svg { width: 18px; height: 18px; fill: currentColor; }
    .sns:hover { color: var(--cobalt); border-color: var(--cobalt); }
    .sns:focus-visible {
      outline: 3px solid var(--cobalt);
      outline-offset: 4px;
    }

    /* スマホ */
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; }
      .statement { min-height: 72vh; padding: 56px 16px; }
      .statement::before { inset: 16px; }
      .statement p { font-size: clamp(48px, 14vw, 80px); }
      .profile { padding: 48px 20px 64px; }
      .section { margin-top: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .statement .line { animation: none; }
      .sns { transition: none; }
    }
  </style>
</head>
<body>
  <section class="statement" aria-label="一言メッセージ">
    <p>
      <span class="line"><span class="latin">AI</span>で</span>
      <span class="line">仕事を変えたい</span>
    </p>
  </section>

  <main class="profile">
    <h1>渡辺賢二</h1>
    <p class="job">自営業</p>

    <section class="section">
      <h2>好きなこと</h2>
      <ul class="likes">
        <li>映画</li>
        <li>旅行</li>
        <li>ゲーム</li>
      </ul>
    </section>

    <section class="section">
      <h2>SNS</h2>
      <a class="sns" href="https://x.com/kjoden327" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @kjoden327
      </a>
    </section>
  </main>
</body>
</html>
